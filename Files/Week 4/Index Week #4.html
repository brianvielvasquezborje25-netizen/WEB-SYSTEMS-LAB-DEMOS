<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Week 3 CSS Lab</title>

    <link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>

<body>

    <header>

        <h1 id="heading">Welcome to My Webpage</h1>
<button id="themeToggle">Switch Theme</button>
        <nav>

            <ul>

                <li><a href="#about">About</a></li>

                <li><a href="#services">Services</a></li>

                <li><a href="#contact">Contact</a></li>

            </ul>

        </nav>

    </header>

    <main>
<section><input type="text" id="taskInput" placeholder="Enter
a task">
<button id="addTask">Add Task</button>
<ul id="taskList"></ul>
</section>
        <section id="about">

            <h2>About Us</h2>

            <p>Welcome to our website! This section introduces our company and its values.</p>

        </section>

        <section id="services">

            <h2>Services</h2>

            <p>We offer a range of services designed to meet your needs.</p>


        </section>

        <section id="contact">

            <h2>Contact Us</h2>

            <form>

                <label for="name">Name:</label>

                <input type="text" id="name" name="name" required>

                <label for="message">Message:</label>

                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send</button>
                

            </form>

        </section>
<section> <form id="contactForm">
    <label for="email">Email:</label>
    <input type="email"
id="email">
    <button type="submit">Submit</button>
</form>
 
<div id="modal" class="modal">
    <div class="modal-content">
        <p id="modalMessage"></p>
        <button id="closeModal">Close</button>
    </div>
</div></section>
    </main>

    <footer>

        <p>&copy; 2025 Your Company Name</p>

    </footer>

</body>
</html>
