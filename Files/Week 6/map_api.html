<!DOCTYPE html>
<html lang="en">
<head>
    <title>Google Maps API Example</title>
    <script>
        function initMap() {
            let map = new google.maps.Map(document.getElementById("map"), {
                zoom: 5,
                center: { lat: 43.6532, lng: 79.3832 } // Default location (Manila, PH)
            });
        }

        function searchLocation() {
            let location = document.getElementById("locationInput").value;
            let geocoder = new google.maps.Geocoder();
            
            geocoder.geocode({ 'address': location }, function(results, status) {
                if (status == 'OK'){
                    let map = new google.maps.Map(document.getElementById("map"), {
                        zoom: 10,
                        center: results[0].geometry.location
                    });
                } else {
                    alert("Location not found!");
                }
            });
        }
    </script>
</head>
<body>
    <h2>Google Maps Integration</h2>
    
    <div style="margin-bottom: 10px;">
        <input type="text" id="locationInput" placeholder="Enter a location">
        <button onclick="searchLocation()">Search</button>
    </div>

    <div id="map" style="height:400px; width:100%;"></div>
 
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB1evkG4hDrZYUp2Nuj9FJ4MZILOEC6plk&callback=initMap"></script>
</body>
</html>
